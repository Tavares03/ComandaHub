# Exemplo de producao: PostgreSQL + API + nginx (painel e /api na mesma porta).
#
#   cp .env.example .env    # defina SECRET_KEY e POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend python -m scripts.create_admin \
#       --email voce@sualoja.com.br --name "Seu Nome" --store "Sua Loja"
#
# Sem dados demo e sem o simulador de pedidos. Coloque HTTPS na frente (proxy/CDN) ao publicar.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comandahub
      POSTGRES_USER: comandahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comandahub -d comandahub"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://comandahub:${POSTGRES_PASSWORD}@db:5432/comandahub
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY (32+ caracteres) no .env}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      SEED_DEMO_DATA: "false"
      # So o nginx fala com a API (a porta 8000 nao e publicada): confia no X-Forwarded-For dele
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
