server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # API (mesma origem: sem CORS em producao)
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location = /health {
    proxy_pass http://backend:8000/health;
  }

  # Cache via "expires" (um add_header aqui descartaria os headers de seguranca acima)
  # Arquivos com hash no nome podem ficar em cache por muito tempo
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA: rotas do Angular (/cardapio/minha-loja, /pedido/codigo...) caem no index.html
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
